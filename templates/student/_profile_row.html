<div class="col-md-6">
  <div class="d-flex gap-2 align-items-start">
    <i class="bi bi-{{ icon }} text-muted mt-1" style="font-size:.9rem;width:18px"></i>
    <div>
      <div style="font-size:.75rem;color:#94a3b8;font-weight:500;text-transform:uppercase;letter-spacing:.05em">{{ label }}</div>
      <div style="font-size:.9rem;font-weight:500;color:#0f172a">{{ value|default:"—" }}</div>
    </div>
  </div>
</div>
