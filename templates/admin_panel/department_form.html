{% extends "admin_panel/base_admin.html" %}
{% block title %}Edit Department{% endblock %}
{% block page_title %}Edit Department{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header py-3"><h6 class="mb-0 fw-semibold"><i class="bi bi-building text-primary me-2"></i>Edit Department</h6></div>
      <div class="card-body p-4">
        <form method="POST" enctype="multipart/form-data">{% csrf_token %}
          {% for field in form %}<div class="mb-3"><label class="form-label fw-semibold" style="font-size:.85rem">{{ field.label }}</label>{{ field }}</div>{% endfor %}
          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'admin_departments' %}" class="btn btn-outline-secondary rounded-3"><i class="bi bi-arrow-left me-1"></i>Cancel</a>
            <button type="submit" class="btn btn-primary rounded-3"><i class="bi bi-save me-1"></i>Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
